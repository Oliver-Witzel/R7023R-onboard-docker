services:
  obc:
    build:
      context: .
      dockerfile: obc/Dockerfile
    environment:
      - MIB_PATH=/app/common/mib.txt    
    networks: [link]

  ground:
    build:
      context: .
      dockerfile: ground/Dockerfile
    networks: [link]
    depends_on: [obc, payload]
    stdin_open: true
    tty: true
    environment:
      - MIB_PATH=/app/common/mib.txt
    volumes:
      - ./data/ground:/data    

networks:
  link:
    driver: bridge
