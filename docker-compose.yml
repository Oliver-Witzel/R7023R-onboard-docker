services:
  obc:
    build:
      context: .
      dockerfile: obc/Dockerfile
    environment:
      - MIB_PATH=/app/common/mib.txt 
      - PL_LOG=/data/Pl_log.txt   
    networks: [link]
    volumes:
      - ./data/payload:/data

  ground:
    build:
      context: .
      dockerfile: ground/Dockerfile
    networks: [link]
    depends_on: [obc]
    stdin_open: true
    tty: true
    environment:
      - MIB_PATH=/app/common/mib.txt
      - HK_LOG=/data/HK_log.txt
    volumes:
      - ./data/ground:/data    

networks:
  link:
    driver: bridge
